<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>Resumo Inteligente IA</title>


  <link rel="stylesheet" href="css/style.css">
</head>


<body>


  <div class="container">


    <h1>Resumo Inteligente IA</h1>


    <textarea
      id="texto"
      placeholder="Cole ou escreva seu conteúdo aqui..."
    ></textarea>


    <select id="categoria">


      <option value="Bíblia">Bíblia</option>


      <option value="Contabilidade">
        Contabilidade
      </option>


      <option value="Programação">
        Programação
      </option>


      <option value="Estudos">
        Estudos
      </option>


    </select>


    <input type="file" id="arquivo">


    <button onclick="gerarResumo()">
      Gerar Resumo
    </button>


    <div id="historico"></div>


  </div>


  <script src="js/script.js"></script>


</body>
</html>
